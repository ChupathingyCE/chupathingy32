name: Release

# Chupathingy32's releases, test builds and nightlies of the 32-bit Windows
# and Linux builds (docs/releases.md), the same three kinds the game has:
#
#   release  a pushed tag v<VERSION>, VERSION being the game's at the tag's
#            submodule commit (git tag v0.9.2 && git push origin v0.9.2).
#            Built as that version, a release's build (its updater looks for
#            newer releases here), published as v<VERSION>, marked latest.
#   testing  by hand (Actions, Release, Run workflow, kind testing): this
#            repository's main (or the branch it is started on) as <VERSION>-testing.<serial>, the serial the
#            build's time (UTC, YYYYMMDDHHMM), published as the pre-release
#            v<VERSION>-testing, replacing the last one, and its list copied
#            to the fixed "testing" pre-release, the testing channel's feed.
#   nightly  every night (once the repository variable NIGHTLY_PUBLISH is
#            true) and by hand: main, with the game moved to the game's own
#            main in the run only, as <VERSION>-nightly.<serial>, published
#            as the pre-release "nightly", replacing the last. A night on
#            which neither main changed builds nothing.
#
# Test builds and nightlies are never marked latest, so players on the
# release channel never see them.
#
# Nothing is signed here: no key is ever in this repository. A release is
# published as a draft, and a test build or a nightly as an unsigned
# pre-release; both can be downloaded by hand, but no updater installs them
# until ChupathingyCE's release workflows (the command repository's
# Chupathingy32 workflow) have signed them: they check this run (the notes'
# "Build:" line), take its release-unsigned artifact, sign the zips and
# updates.json with the game's update keys, upload the signatures, and then
# publish the release as latest, or copy a test build's list to the
# "testing" pre-release, the testing channel's feed (docs/releases.md).
on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: testing (a test build of main) or nightly
        type: choice
        options:
          - testing
          - nightly
        default: testing
      notes:
        description: What this build is for (added to the notes)
        type: string
        default: ""
      force:
        description: "A nightly: build even if nothing changed since the last"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref || inputs.kind || 'nightly' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.plan.outputs.build }}
      kind: ${{ steps.plan.outputs.kind }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      commit: ${{ steps.plan.outputs.commit }}
      game: ${{ steps.plan.outputs.game }}
      game_ref: ${{ steps.plan.outputs.game_ref }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GAME_REPO: ChupathingyCE/chupathingyce
      # (the game's merge of its updater fix: every build here has it)
      GAME_FIX: f4359df38357218889178132b27a07f83f9a13bf
      EVENT: ${{ github.event_name }}
      KIND: ${{ inputs.kind }}
      FORCE: ${{ inputs.force }}
      NIGHTLY_PUBLISH: ${{ vars.NIGHTLY_PUBLISH }}
    steps:
      # (the tag, or the branch the run was started on: main for test
      # builds and nightlies)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Plan
        id: plan
        run: |
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1=$2"; }
          commit="$(git rev-parse HEAD)"
          game="$(git rev-parse HEAD:chupathingyce)"
          serial="$(date -u +%Y%m%d%H%M)"
          kind="$KIND"
          [ "$EVENT" = push ] && kind=release
          [ "$EVENT" = schedule ] && kind=nightly
          game_ref=
          if [ "$kind" = nightly ]; then
            if [ "$EVENT" = schedule ] && [ "$NIGHTLY_PUBLISH" != true ]; then
              echo "Nightlies are off (repository variable NIGHTLY_PUBLISH): no build."
              out build false
              exit 0
            fi
            game="$(gh api "repos/$GAME_REPO/commits/main" --jq .sha)"
            game_ref="$game"
            if body="$(gh release view nightly --json body --jq .body 2>/dev/null)"; then
              last_c32="$(printf '%s\n' "$body" | sed -n 's/^Chupathingy32: \([0-9a-f]\{40\}\).*/\1/p' | head -1)"
              last_game="$(printf '%s\n' "$body" | sed -n 's/^Game: \([0-9a-f]\{40\}\).*/\1/p' | head -1)"
              if [ "$commit" = "$last_c32" ] && [ "$game" = "$last_game" ] && [ "$FORCE" != true ]; then
                echo "Nothing changed since the last nightly: no build."
                out build false
                exit 0
              fi
            fi
          fi
          # (the game's VERSION at the commit that is built)
          base="$(gh api "repos/$GAME_REPO/contents/VERSION?ref=$game" -H "Accept: application/vnd.github.raw" | tr -d '[:space:]')"
          case "$kind" in
            release)
              version="$base"
              tag="$GITHUB_REF_NAME"
              if [ "$tag" != "v$base" ]; then
                echo "::error::the tag is $tag, but the game's VERSION at the submodule's commit ($game) is $base: tag v$base"
                exit 1
              fi ;;
            testing)
              version="$base-testing.$serial"
              tag="v$base-testing" ;;
            nightly)
              version="$base-nightly.$serial"
              tag="nightly" ;;
            *)
              echo "::error::unknown kind $kind"; exit 1 ;;
          esac
          # (never a game without the updater fix that stops it deleting a
          # halo.exe that isn't ours, ChupathingyCE/chupathingyce#1855; and a
          # release's game is on the game's own release of that version)
          contains() {
            state="$(gh api "repos/$GAME_REPO/compare/$1...$2" --jq .status)" || return 1
            [ "$state" = ahead ] || [ "$state" = identical ]
          }
          if ! contains "$GAME_FIX" "$game"; then
            echo "::error::the game's commit $game does not have the game's updater fix ($GAME_FIX, ChupathingyCE/chupathingyce#1855): move the submodule to the game's latest release"
            exit 1
          fi
          if [ "$kind" = release ]; then
            released="$(gh api "repos/$GAME_REPO/commits/v$base" --jq .sha 2>/dev/null)" || released=
            if [ -z "$released" ] || ! contains "$game" "$released"; then
              echo "::error::the game's commit $game is not in the game's release v$base${released:+ ($released)}: move the submodule to that release's commit"
              exit 1
            fi
          fi
          out build true
          out kind "$kind"
          out version "$version"
          out tag "$tag"
          out ref "$commit"
          out commit "$commit"
          out game "$game"
          out game_ref "$game_ref"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.plan.outputs.ref }}
      game-ref: ${{ needs.plan.outputs.game_ref }}
      version: ${{ needs.plan.outputs.version }}
      release: ${{ needs.plan.outputs.kind == 'release' }}

  package:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.ref }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: c32-*
          path: artifacts

      - name: Package
        run: |
          python3 tools/c32_package.py artifacts release
          ls -l release

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-unsigned
          path: release/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: [plan, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KIND: ${{ needs.plan.outputs.kind }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      GAME: ${{ needs.plan.outputs.game }}
      NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-unsigned
          path: release

      - name: Publish
        run: |
          ls -l release
          {
            case "$KIND" in
              release) echo "Chupathingy $VERSION for 32-bit Windows and 32-bit Linux (x86). The same game as Chupathingy v$VERSION: https://github.com/ChupathingyCE/chupathingyce/releases/tag/v$VERSION" ;;
              testing) echo "A test build of Chupathingy32, $VERSION, for 32-bit Windows and 32-bit Linux (x86). Please try it and report bugs in #bug-reports on the Discord." ;;
              nightly) echo "Tonight's build of Chupathingy32, $VERSION, for 32-bit Windows and 32-bit Linux (x86), with the game's newest main. Untested." ;;
            esac
            echo
            # (these four before anything given by hand: the signing
            # workflow reads the first line of each)
            echo "Version: $VERSION"
            echo "Chupathingy32: $COMMIT"
            echo "Game: $GAME"
            echo "Build: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Not signed yet: the in-game updater installs it once it is signed."
            echo
            echo "- Windows (32-bit): chupathingyce-windows-release.zip"
            echo "- Linux (32-bit): chupathingyce-linux-release.zip"
            echo
            echo "On 64-bit Windows, Linux or macOS, the game's own builds run better: https://github.com/ChupathingyCE/chupathingyce/releases/latest"
            echo
            echo "Bring your own copy of Halo: no game files are included."
            if [ -n "$NOTES" ]; then echo; echo "$NOTES"; fi
            echo
            echo "Free software under the GNU GPL, version 3 or later, with no warranty. Source: https://github.com/$GH_REPO/tree/$COMMIT"
          } > notes.md
          cat notes.md
          files=(release/*)
          case "$KIND" in
            release)
              if gh release view "$TAG" > /dev/null 2>&1; then
                echo "::error::$TAG is released already"; exit 1
              fi
              # (a draft until it is signed: ChupathingyCE's release workflows
              # sign it and publish it as latest)
              gh release create "$TAG" "${files[@]}" --verify-tag --title "Chupathingy32 $TAG" --notes-file notes.md --draft ;;
            testing|nightly)
              title="Chupathingy32 test build $VERSION"
              [ "$KIND" = nightly ] && title="Chupathingy32 nightly $VERSION"
              # (the last one replaced, its tag with it)
              gh release delete "$TAG" --yes --cleanup-tag > /dev/null 2>&1 || true
              gh release create "$TAG" "${files[@]}" --target "$COMMIT" --prerelease --latest=false \
                --title "$title" --notes-file notes.md
              ;;
          esac
