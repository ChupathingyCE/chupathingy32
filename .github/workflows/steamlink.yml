name: Steam Link

# The Steam Link build (port/steamlink, JizzyRivers' port), for every push to
# main, every pull request and by hand: the game's 32-bit Linux build
# compiled for the 2015 Steam Link (32-bit ARM, OpenGL ES 2) with clang,
# against Valve's steamlink-sdk (its root filesystem and gcc's runtime),
# which is fetched here from Valve's public repository at a pinned commit
# and never committed. SDL3 is built for the box with
# port/steamlink/toolchain.cmake, at the game's SDL pin. The app
# (build/chupathingyce.tgz, for a USB stick) and the update zip are kept as
# the run's artifact. No secrets and no game files. Not released yet
# (docs/releases.md).
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      game-ref:
        description: A commit of the game to build instead of the submodule's (empty, the submodule's)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: steamlink-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Valve's steamlink-sdk, master on 2025-03-17
  STEAMLINK_SDK_COMMIT: 62b4d098d1472c3534dd098ca2a0e0e10712f1c6
  # the game's SDL pin (its tools/android_build.py: SDL_TAG, SDL_COMMIT)
  SDL_TAG: release-3.4.16
  SDL_COMMIT: fa2c02bb6e21974a89ea9824bc53c9932abe5f9c

jobs:
  steamlink:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install the build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang lld llvm cmake ninja-build file
          clang --version | head -1

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Use the requested game commit
        env:
          GAME_REF: ${{ inputs.game-ref }}
        run: |
          if [ -n "$GAME_REF" ]; then
            git -C chupathingyce fetch --depth 1 origin "$GAME_REF"
            git -C chupathingyce checkout --detach FETCH_HEAD
          fi
          git -C chupathingyce log -1 --oneline
          grep -q "SDL_COMMIT = \"$SDL_COMMIT\"" chupathingyce/tools/android_build.py \
            || echo "::warning::the game's SDL pin moved from $SDL_TAG: update SDL_TAG and SDL_COMMIT here"

      - uses: actions/cache/restore@v4
        id: sdk
        with:
          path: steamlink-sdk
          key: steamlink-sdk-${{ env.STEAMLINK_SDK_COMMIT }}

      # the toolchain and the root filesystem only: the whole SDK is 3 GB
      - name: Fetch the Steam Link SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          git init -q steamlink-sdk
          cd steamlink-sdk
          git remote add origin https://github.com/ValveSoftware/steamlink-sdk.git
          git sparse-checkout set toolchain rootfs
          git fetch -q --depth 1 --filter=blob:none origin "$STEAMLINK_SDK_COMMIT"
          git checkout -q FETCH_HEAD

      - uses: actions/cache/save@v4
        if: steps.sdk.outputs.cache-hit != 'true'
        with:
          path: steamlink-sdk
          key: steamlink-sdk-${{ env.STEAMLINK_SDK_COMMIT }}

      # console only (SDL_UNIX_CONSOLE_BUILD): the box has no X11 or
      # Wayland, its screen is SDL's Vivante driver. No PulseAudio: the SDK
      # has its libpulse.pc but not the library
      - name: Build SDL3
        run: |
          git clone -q --depth 1 --branch "$SDL_TAG" https://github.com/libsdl-org/SDL.git build/SDL
          test "$(git -C build/SDL rev-parse HEAD)" = "$SDL_COMMIT"
          export MARVELL_SDK_PATH="$PWD/steamlink-sdk"
          cmake -S build/SDL -B build/SDL/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/port/steamlink/toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/sdl3" \
            -DSDL_UNIX_CONSOLE_BUILD=ON -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DSDL_PULSEAUDIO=OFF -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_VULKAN=OFF -DSDL_OPENGL=OFF -DSDL_OPENGLES=ON
          cmake --build build/SDL/build
          cmake --install build/SDL/build

      - name: Build
        env:
          MARVELL_SDK_PATH: ${{ github.workspace }}/steamlink-sdk
        run: |
          cd chupathingyce
          python3 configure.py --release --console-port ../port/steamlink
          grep -q "^build steamlink:" build.ninja || { echo "::error::configure did not set up the Steam Link build"; exit 1; }
          ninja steamlink
          file build/steamlink/halo
          file build/steamlink/halo | grep -q "ELF 32-bit LSB.*ARM" || { echo "::error::not a 32-bit ARM program"; exit 1; }

      - name: Package
        run: |
          python3 port/steamlink/package.py
          ls -l build/chupathingyce.tgz build/chupathingyce-steamlink-release.zip

      - uses: actions/upload-artifact@v4
        with:
          name: c32-steamlink
          path: |
            build/chupathingyce.tgz
            build/chupathingyce-steamlink-release.zip
          if-no-files-found: error
          retention-days: 7
