name: Build

# Chupathingy32's builds: 32-bit Windows (x86) and 32-bit Linux (x86), for
# every push to main, every pull request and by hand, each kept as the run's
# artifact. Each is the game's own build (ninja windows, ninja linux), made
# by the game's tools/ci_build.py in the chupathingyce submodule through
# tools/c32_build.py, which points the self-updater at this repository's
# releases. No secrets are used here and no game files are packaged. The
# release workflow (release.yml) calls this one with a version.
#
# The toolchains are the game's own Build's (its .github/workflows/build.yml,
# jobs linux and windows): clang 22 from apt.llvm.org on Ubuntu 24.04, and
# the Windows runner's LLVM, Visual Studio x86 libraries and MSYS2. The
# Linux build links against Debian 11's 32-bit glibc 2.31 (the game's
# tools/linux_sysroot.py), so it starts on older distributions.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      game-ref:
        description: A commit of the game to build instead of the submodule's (empty, the submodule's)
        type: string
        default: ""
  workflow_call:
    inputs:
      game-ref:
        description: A commit of the game to build instead of the submodule's (the nightly's; empty, the submodule's)
        type: string
        default: ""
      ref:
        description: The commit of this repository to build (a tag; empty, the run's)
        type: string
        default: ""
      version:
        description: The version (tools/version.py in the game; empty, VERSION's -dev)
        type: string
        default: ""
      release:
        description: A release's build (its updater looks for newer releases)
        type: boolean
        default: false
      debug:
        description: Build debug as well as release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HALO_VERSION: ${{ inputs.version }}
  HALO_RELEASE_BUILD: ${{ inputs.release && '1' || '0' }}
  HALO_UPDATE_REPOSITORY: ChupathingyCE/chupathingy32
  BUILD_DEBUG: ${{ inputs.debug && 'true' || 'false' }}
  CI_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 1G
  # (a versioned build, the ones that are signed, starts from no cache)
  CACHE_RESTORE: ${{ inputs.version == '' && 'true' || 'false' }}
  CACHE_SAVE: ${{ github.ref == 'refs/heads/main' && inputs.version == '' && 'true' || 'false' }}

jobs:
  linux-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install the toolchain
        timeout-minutes: 15
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-fail-fast > /dev/null
          apt_try() {
            for attempt in 1 2 3; do
              sudo timeout 300 "$@" && return 0
              echo "apt: try $attempt of $* failed" >&2
              sleep 10
            done
            return 1
          }
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL --retry 3 --max-time 60 https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM_MAJOR main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          apt_try apt-get update -q
          apt_try apt-get install -y -q --no-install-recommends "clang-$LLVM_MAJOR" "lld-$LLVM_MAJOR" "llvm-$LLVM_MAJOR" \
            "libclang-rt-$LLVM_MAJOR-dev" gcc gcc-multilib libc6-dev-i386 cmake pkg-config libwayland-bin \
            ninja-build ccache python3-pytest zstd
          echo "/usr/lib/llvm-$LLVM_MAJOR/bin" >> "$GITHUB_PATH"
        env:
          LLVM_MAJOR: 22

      - name: Toolchain versions
        run: |
          clang --version | head -n 1
          ld.lld --version
          cmake --version | head -n 1
          ccache --version | head -n 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          submodules: true

      - name: Use the requested game commit
        env:
          GAME_REF: ${{ inputs.game-ref }}
        run: |
          if [ -n "$GAME_REF" ]; then
            git -C chupathingyce fetch --depth 1 origin "$GAME_REF"
            git -C chupathingyce checkout --detach FETCH_HEAD
          fi
          git -C chupathingyce log -1 --oneline
          echo "VERSION $(cat chupathingyce/VERSION)"

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: env.CACHE_RESTORE == 'true'
        with:
          path: .ccache
          key: ccache-linux-x86-clang22-${{ github.sha }}
          restore-keys: ccache-linux-x86-clang22-

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache-downloads
        if: env.CACHE_RESTORE == 'true'
        with:
          path: chupathingyce/build/downloads
          key: ffmpeg-source-${{ hashFiles('chupathingyce/tools/ffmpeg_build.py') }}

      # the system root and SDL's source, which the game's build downloads
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache-third-party
        if: env.CACHE_RESTORE == 'true'
        with:
          path: chupathingyce/build/linux/third_party
          key: linux-third-party-${{ hashFiles('chupathingyce/tools/linux_sysroot.py') }}

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache-bgfx
        if: env.CACHE_RESTORE == 'true'
        with:
          path: chupathingyce/build/bgfx
          key: bgfx-source-${{ runner.os }}-${{ hashFiles('chupathingyce/tools/bgfx_build.py', 'chupathingyce/tools/bgfx-patches/**') }}
          restore-keys: bgfx-source-${{ runner.os }}-

      - name: Debug
        if: env.BUILD_DEBUG == 'true'
        run: python3 tools/c32_build.py linux debug

      - name: Release
        run: python3 tools/c32_build.py linux release

      # (no executable or library that needs a newer glibc than the system
      # root's: the game's tools/linux_glibc_check.py)
      - name: glibc 2.31
        run: python3 chupathingyce/tools/linux_glibc_check.py dist/chupathingyce-linux-*

      - name: 32-bit
        run: |
          file dist/chupathingyce-linux-release/chupathingy
          file dist/chupathingyce-linux-release/chupathingy | grep -q "ELF 32-bit LSB" \
            || { echo "::error::the Linux game is not a 32-bit x86 program"; exit 1; }

      - name: Icon
        run: |
          for file in chupathingy32-16.png chupathingy32-256.png desktop-entry.sh; do
            test -f "dist/chupathingyce-linux-release/$file" || { echo "::error::$file is not beside the Linux game"; exit 1; }
          done

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: c32-linux-x86
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.version != ''
        with:
          name: symbols-linux-x86
          path: symbols/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-downloads.outputs.cache-hit != 'true' }}
        with:
          path: chupathingyce/build/downloads
          key: ffmpeg-source-${{ hashFiles('chupathingyce/tools/ffmpeg_build.py') }}

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-third-party.outputs.cache-hit != 'true' }}
        with:
          path: chupathingyce/build/linux/third_party
          key: linux-third-party-${{ hashFiles('chupathingyce/tools/linux_sysroot.py') }}

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-bgfx.outputs.cache-hit != 'true' }}
        with:
          path: chupathingyce/build/bgfx
          key: bgfx-source-${{ runner.os }}-${{ hashFiles('chupathingyce/tools/bgfx_build.py', 'chupathingyce/tools/bgfx-patches/**') }}

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ success() && env.CACHE_SAVE == 'true' }}
        with:
          path: .ccache
          key: ccache-linux-x86-clang22-${{ github.sha }}

  windows-x86:
    # The runner image has LLVM, Python, MSYS2 (the movies' FFmpeg builds
    # under its shell) and Visual Studio's x86 libraries and Windows SDK.
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the toolchain
        shell: pwsh
        run: |
          Invoke-WebRequest -OutFile ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip
          Invoke-WebRequest -OutFile ccache.zip https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-windows-x86_64.zip
          # (each download checked against the hash the game's Build pins)
          if ((Get-FileHash ninja.zip -Algorithm SHA256).Hash -ne "F550FEC705B6D6FF58F2DB3C374C2277A37691678D6ABA463ADCBB129108467A") { throw "ninja.zip: unexpected SHA-256" }
          if ((Get-FileHash ccache.zip -Algorithm SHA256).Hash -ne "6252F081876A9A9F700FAE13A5AEC5D0D486B28261D7F1F72AC11C7AD9DF4DA9") { throw "ccache.zip: unexpected SHA-256" }
          Expand-Archive ninja.zip -DestinationPath "$env:RUNNER_TEMP\tools"
          Expand-Archive ccache.zip -DestinationPath $env:RUNNER_TEMP
          Copy-Item "$env:RUNNER_TEMP\ccache-4.10.2-windows-x86_64\ccache.exe" "$env:RUNNER_TEMP\tools"
          Remove-Item ninja.zip, ccache.zip
          "$env:RUNNER_TEMP\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          submodules: true

      - name: Use the requested game commit
        env:
          GAME_REF: ${{ inputs.game-ref }}
        run: |
          if [ -n "$GAME_REF" ]; then
            git -C chupathingyce fetch --depth 1 origin "$GAME_REF"
            git -C chupathingyce checkout --detach FETCH_HEAD
          fi
          git -C chupathingyce log -1 --oneline
          echo "VERSION $(cat chupathingyce/VERSION)"

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: env.CACHE_RESTORE == 'true'
        with:
          path: .ccache
          key: ccache-windows-x86-${{ github.sha }}
          restore-keys: ccache-windows-x86-

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache-downloads
        if: env.CACHE_RESTORE == 'true'
        with:
          path: chupathingyce/build/downloads
          key: ffmpeg-source-${{ hashFiles('chupathingyce/tools/ffmpeg_build.py') }}

      # SDL's development package, which the game's configure.py fetches
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache-third-party
        if: env.CACHE_RESTORE == 'true'
        with:
          path: chupathingyce/build/windows/third_party
          key: windows-third-party-${{ hashFiles('chupathingyce/tools/windows_build.py') }}

      # the movies' FFmpeg (the game's tools/ffmpeg_build.py), built once and
      # cached: its configure and make run under the runner's MSYS2
      - name: MSYS2 make
        run: /c/msys64/usr/bin/pacman.exe -S --noconfirm --needed make diffutils

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache-ffmpeg
        if: env.CACHE_RESTORE == 'true'
        with:
          path: chupathingyce/build/windows/ffmpeg
          key: windows-ffmpeg-${{ hashFiles('chupathingyce/tools/ffmpeg_build.py') }}

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache-bgfx
        if: env.CACHE_RESTORE == 'true'
        with:
          path: chupathingyce/build/bgfx
          key: bgfx-source-${{ runner.os }}-${{ hashFiles('chupathingyce/tools/bgfx_build.py', 'chupathingyce/tools/bgfx-patches/**') }}
          restore-keys: bgfx-source-${{ runner.os }}-

      - name: Debug
        if: env.BUILD_DEBUG == 'true'
        run: python tools/c32_build.py windows debug

      - name: Release
        run: python tools/c32_build.py windows release

      - name: 32-bit
        run: |
          # (the PE header's machine: 0x014c is x86)
          python - <<'PY'
          import struct, sys
          data = open("dist/chupathingyce-windows-release/chupathingy.exe", "rb").read(4096)
          offset = struct.unpack_from("<I", data, 0x3C)[0]
          machine = struct.unpack_from("<H", data, offset + 4)[0]
          print(f"chupathingy.exe machine 0x{machine:04x}")
          sys.exit(0 if machine == 0x014C else "the Windows game is not a 32-bit x86 program")
          PY

      # (the icon's images go into the executable as they are in the .ico:
      # its 16-pixel one is art/icon/chupathingy32-16.png, byte for byte)
      - name: Icon
        run: |
          python - <<'PY'
          import sys
          icon = open("art/icon/chupathingy32-16.png", "rb").read()
          # (the only executable: the game has built no halo.exe stub since
          # 0.9.2, ChupathingyCE/chupathingyce#1855)
          for name in ("chupathingy.exe",):
              data = open(f"dist/chupathingyce-windows-release/{name}", "rb").read()
              print(f"{name}: Chupathingy32's icon {'found' if icon in data else 'missing'}")
              if icon not in data:
                  sys.exit(f"{name} does not carry Chupathingy32's icon")
          PY

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: c32-windows-x86
          path: dist/
          if-no-files-found: error
          retention-days: 7

      # (chupathingy.exe's symbols, for crash reports; not a download)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.version != ''
        with:
          name: symbols-windows-x86
          path: symbols/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-downloads.outputs.cache-hit != 'true' }}
        with:
          path: chupathingyce/build/downloads
          key: ffmpeg-source-${{ hashFiles('chupathingyce/tools/ffmpeg_build.py') }}

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-third-party.outputs.cache-hit != 'true' }}
        with:
          path: chupathingyce/build/windows/third_party
          key: windows-third-party-${{ hashFiles('chupathingyce/tools/windows_build.py') }}

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-ffmpeg.outputs.cache-hit != 'true' }}
        with:
          path: chupathingyce/build/windows/ffmpeg
          key: windows-ffmpeg-${{ hashFiles('chupathingyce/tools/ffmpeg_build.py') }}

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-bgfx.outputs.cache-hit != 'true' }}
        with:
          path: chupathingyce/build/bgfx
          key: bgfx-source-${{ runner.os }}-${{ hashFiles('chupathingyce/tools/bgfx_build.py', 'chupathingyce/tools/bgfx-patches/**') }}

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ success() && env.CACHE_SAVE == 'true' }}
        with:
          path: .ccache
          key: ccache-windows-x86-${{ github.sha }}
